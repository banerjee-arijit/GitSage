spring.application.name=server

# Import .env file (tries current directory and server/ directory)
spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties]

# Database Configuration with Defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dev_link?createDatabaseIfNotExists=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring AI - Gemini Flash Configuration
spring.ai.openai.api-key=${GEMINI_API_KEY:AIzaSyAt_sdOX0p1AxyhxMsh2873DE4jkCVDxgA}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-2.5-flash

# GitHub OAuth Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23limPDYlVwCnbS36J}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:0791ccc64834eb47bc11d82e50e0e537a6e48985}
spring.security.oauth2.client.registration.github.scope=read:user,repo
